<div>
  <label for="{{ field.id_for_label }}" class="label mb-1 text-base-content">{{ field.label }}{% if field.field.required %} <span class="text-error" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="mt-1 text-xs text-base-content/70">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error" class="mt-1 text-sm text-red-700">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
