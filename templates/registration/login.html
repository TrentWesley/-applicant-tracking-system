{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block body %}
<main id="main" class="flex min-h-screen items-center justify-center p-4">
  <section class="card w-full max-w-sm bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">Applicant Tracking</h1>
      <p class="text-sm text-base-content/70">Staff sign-in</p>

      {% if form.non_field_errors %}
      <div class="alert alert-error" role="alert">
        {% for error in form.non_field_errors %}<span>{{ error }}</span>{% endfor %}
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}" class="mt-2 space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label for="{{ form.username.id_for_label }}" class="label mb-1">Username</label>
          {{ form.username }}
        </div>
        <div>
          <label for="{{ form.password.id_for_label }}" class="label mb-1">Password</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-full">Log in</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
